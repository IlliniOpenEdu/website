name: Deploy Homepage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: homepage/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: homepage

      - name: Build
        run: npm run build
        working-directory: homepage

      - name: Add custom domain
        run: echo "illiniopenedu.org" > homepage/dist/CNAME

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: homepage/dist
          clean: true
